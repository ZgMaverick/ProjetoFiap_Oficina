services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oficina
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina
    ports:
      - "5432:5432"
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina -d oficina"]
      interval: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Oficina: "Host=db;Port=5432;Database=oficina;Username=oficina;Password=oficina"
      Jwt__Chave: "${JWT_CHAVE:-troque-esta-chave-por-uma-com-32-caracteres-ou-mais}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dados:
